<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161a1f" />
    <title>OpenFrame Tabletop</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <!--
      The splash lives HERE, not in a React component, and the reason is
      structural: `main.tsx` opens with a top-level `await createRuntime()`, so
      `#root` is empty until IndexedDB answers. A React splash cannot paint
      during the wait it exists to cover — React is most of that wait.

      It is a plain sheet in the application's surface colour with one line of
      text, gone the moment the page is ready: no artwork, and no hold. A loading
      screen that delays loading is a joke at the user's expense.

      The colours below are literals because a stylesheet has not loaded yet at
      first paint. `app/boot-splash.test.ts` asserts they equal each theme's
      surface colour in styles/tokens.css, so there is still one source of truth.
    -->
    <!--
      Schemas are interpreted, never compiled. Zod compiles an object schema
      with `new Function` when it may, and finds out by trying once, as each
      schema is DEFINED. The page's policy refuses eval, so the answer is
      always no, but the attempt is still reported as a violation on every
      load, burying any real one. No module can say so in time, because zod
      and the board's schemas share a chunk that runs before any of our code,
      so this does, before any module. Zod reads its config from this global
      (`content-security-policy.test.ts` pins the name against the installed
      zod).
    -->
    <script>
      var zodConfig = (window.__zod_globalConfig = window.__zod_globalConfig || {})
      zodConfig.jitless = true
    </script>
    <!--
      The saved theme, applied before the body is parsed so the first frame is
      already the right one. `restoreTheme()` applies it again after the module
      graph loads; this only has to be early, not complete. The names
      OpenFrame stored before Tabletop (`notebook`, `after-hours`) are read as
      the light and dark they were.
    -->
    <script>
      try {
        var stored = localStorage.getItem('openframe:theme')
        if (stored === 'light' || stored === 'notebook') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f6f8')
        }
      } catch (error) {
        // Storage refused: the default theme is the safe answer.
      }
    </script>
    <style>
      #of-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background-color: #161a1f;
        transition: opacity 140ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      :root[data-theme='light'] #of-splash {
        background-color: #f4f6f8;
      }
      #of-splash[data-state='leaving'] {
        opacity: 0;
        pointer-events: none;
      }
      #of-splash p {
        grid-area: 1 / 1;
        margin: 0;
        color: #a4adba;
        font:
          15px/1.3 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        letter-spacing: 0.01em;
      }
      :root[data-theme='light'] #of-splash p {
        color: #4a5563;
      }
      /*
       * The watchdog's way out. The stylesheet may be the very thing that never
       * arrived, so it carries its own colours.
       */
      #of-splash button {
        grid-area: 1 / 1;
        align-self: end;
        min-height: 30px;
        margin: 0 0 max(32px, env(safe-area-inset-bottom));
        padding: 0 16px;
        border: 1px solid #7d8896;
        border-radius: 6px;
        background: #1d2228;
        color: #e8ebef;
        font:
          13px/1.3 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        cursor: pointer;
      }
      :root[data-theme='light'] #of-splash button {
        border-color: #667283;
        background: #ffffff;
        color: #14181d;
      }
      /* Stalled: the label steps up to make room for the button under it. */
      #of-splash[data-state='stalled'] p {
        align-self: center;
        margin-bottom: 42px;
      }
      #of-splash button:focus-visible {
        outline: 2px solid #6ba3ff;
        outline-offset: 2px;
      }
      :root[data-theme='light'] #of-splash button:focus-visible {
        outline-color: #1c4fb5;
      }
      @media (prefers-reduced-motion: reduce) {
        #of-splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      No `role="status"` on the container. The toast is the application's status
      region, and a second one is a real problem rather than a test-only
      collision: two live regions competing to speak. Content that is already
      present at load is not announced by a live region anyway, so the role was
      buying nothing here.

      The LABEL keeps `aria-live`, because the one thing worth announcing is the
      one thing that changes — the watchdog below replacing it when opening runs
      long. A board that cannot open takes the splash away instead
      (`abandonSplash`), for a panel of its own.
    -->
    <div id="of-splash">
      <p aria-live="polite">Opening</p>
      <!--
        Says what is actually opening, before the first frame. The markup's own
        words are the neutral ones, so a page where this never ran is still
        telling the truth. Mirrors `readRoute()` exactly, validation and all: a
        truncated or mangled link opens the front door, so it must not promise
        a board. `boot-splash.test.ts` holds these patterns to the ones the
        router uses.
      -->
      <script>
        ;(function () {
          var params = new URLSearchParams(location.search)
          var room = params.get('room')
          var board = params.get('board')
          if (
            (room !== null && /^brd_[A-Za-z0-9]{8,48}$/.test(room)) ||
            (board !== null && /^board_[A-Za-z0-9-]{1,48}$/.test(board))
          ) {
            document.currentScript.previousElementSibling.textContent = 'Opening the board'
          }
        })()
      </script>
    </div>
    <!--
      The watchdog. Inline, and before the module graph, because the case it
      exists for is the one where the application never arrives: an entry
      module the network dropped, or a start-up that stalled rather than
      failed. A splash over an inert root that never goes is a page that cannot
      be used and does not say so. After twelve seconds it admits it, in the
      live label, and offers the one thing that helps.
    -->
    <script>
      setTimeout(function () {
        var splash = document.getElementById('of-splash')
        if (splash === null) return
        splash.querySelector('p').textContent = 'Still opening.'
        var reload = document.createElement('button')
        reload.type = 'button'
        reload.textContent = 'Reload'
        reload.onclick = function () {
          location.reload()
        }
        splash.dataset.state = 'stalled'
        splash.appendChild(reload)
      }, 12000)
    </script>
    <!--
      `inert` until the splash goes. The splash covers the board and swallows
      the mouse, but focus is not blocked by a sheet on top of it — without
      this, two seconds is long enough to Tab into a toolbar nobody can see.
      `splash.ts` lifts it.
    -->
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
